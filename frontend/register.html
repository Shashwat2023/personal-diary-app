<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Create Account — Personal Diary</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="css/styles.css" />
  <link rel="stylesheet" href="css/animations.css" />
  <style>
    .auth-lines {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }
    .auth-lines::before {
      content: '';
      position: absolute;
      left: 50%;
      top: -200px;
      width: 1px;
      height: 100vh;
      background: linear-gradient(180deg, transparent 0%, rgba(196,147,63,0.08) 40%, transparent 100%);
    }
    .password-hint {
      font-family: var(--font-mono);
      font-size: 0.67rem;
      color: var(--ink-ghost);
      margin-top: 0.3rem;
      padding-left: 0.25rem;
      letter-spacing: 0.02em;
    }
    .auth-logo { justify-content: space-between; }
    .auth-theme-toggle { margin-left: auto; }
    .strength-bar {
      height: 2px;
      background: var(--border-muted);
      border-radius: 1px;
      margin-top: 0.4rem;
      overflow: hidden;
    }
    .strength-fill {
      height: 100%;
      border-radius: 1px;
      width: 0%;
      transition: width 300ms ease, background 300ms ease;
    }
  </style>
</head>
<body class="page-enter">

  <div class="auth-noise"></div>
  <div class="auth-lines"></div>

  <main class="auth-wrapper">
    <div class="auth-card">

      <div class="auth-logo">
        <div class="auth-logo-icon">✦</div>
        <span class="auth-logo-text">Folio</span>
        <button class="theme-toggle auth-theme-toggle" id="theme-toggle" title="Switch to light mode" aria-label="Switch theme">◑</button>
      </div>

      <h1 class="auth-title">Begin your story.</h1>
      <p class="auth-subtitle">// Create your private diary</p>

      <button type="button" class="btn btn-primary" id="google-btn" aria-label="Continue with Google">
        <svg width="18" height="18" viewBox="0 0 48 48" aria-hidden="true" style="vertical-align:-4px;margin-right:8px">
          <path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.9 32.4 29.4 35.5 24 35.5c-6.9 0-12.5-5.6-12.5-12.5S17.1 10.5 24 10.5c3.2 0 6.1 1.2 8.3 3.2l5.7-5.7C34.6 4.7 29.6 2.5 24 2.5 12.4 2.5 3 11.9 3 23.5S12.4 44.5 24 44.5c11 0 21-8 21-21 0-1.4-.1-2.7-.4-4z"/>
          <path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.6 15.9 18.9 13 24 13c3.2 0 6.1 1.2 8.3 3.2l5.7-5.7C34.6 6.7 29.6 4.5 24 4.5c-7.6 0-14.2 4.3-17.7 10.2z"/>
          <path fill="#4CAF50" d="M24 44.5c5.5 0 10.4-2.1 14.1-5.6l-6.5-5.5c-2.1 1.5-4.7 2.4-7.6 2.4-5.3 0-9.8-3.1-11.2-7.7l-6.6 5.1C9.7 40.1 16.3 44.5 24 44.5z"/>
          <path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.9 2.6-2.6 4.8-4.7 6.4l6.5 5.5C40.6 37 44 30.9 44 23.5c0-1.4-.1-2.7-.4-3z"/>
        </svg>
        Continue with Google
      </button>

      <div class="auth-footer" style="margin-top:1.25rem">
        By continuing you agree to our
        <a href="terms.html">Terms</a>, <a href="privacy.html">Privacy Policy</a> and <a href="cookie-policy.html">Cookie Policy</a>.
      </div>

      <div class="auth-footer" style="margin-top:0.5rem; font-size:0.78rem;">
        <a href="refund-policy.html">Refund Policy</a> ·
        Folio, by Shashwat Tripathi <a href="mailto:shashwattripathifiverr@gmail.com">Contact</a>
      </div>

    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabaseClient.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script>
    UI.initTheme();
    Auth.redirectIfAuth();
    document.getElementById('theme-toggle')?.addEventListener('click', () => UI.toggleTheme());

    document.getElementById('google-btn').addEventListener('click', () => {
      Auth.signInWithGoogle();
    });
  </script>

</body>
</html>
