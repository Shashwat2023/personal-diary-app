<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Create Account — Personal Diary</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="css/styles.css" />
  <link rel="stylesheet" href="css/animations.css" />
  <style>
    .auth-lines {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }
    .auth-lines::before {
      content: '';
      position: absolute;
      left: 50%;
      top: -200px;
      width: 1px;
      height: 100vh;
      background: linear-gradient(180deg, transparent 0%, rgba(196,147,63,0.08) 40%, transparent 100%);
    }
    .password-hint {
      font-family: var(--font-mono);
      font-size: 0.67rem;
      color: var(--ink-ghost);
      margin-top: 0.3rem;
      padding-left: 0.25rem;
      letter-spacing: 0.02em;
    }
    .strength-bar {
      height: 2px;
      background: var(--border-muted);
      border-radius: 1px;
      margin-top: 0.4rem;
      overflow: hidden;
    }
    .strength-fill {
      height: 100%;
      border-radius: 1px;
      width: 0%;
      transition: width 300ms ease, background 300ms ease;
    }
  </style>
</head>
<body class="page-enter">

  <div class="auth-noise"></div>
  <div class="auth-lines"></div>

  <main class="auth-wrapper">
    <div class="auth-card">

      <div class="auth-logo">
        <div class="auth-logo-icon">✦</div>
        <span class="auth-logo-text">Folio</span>
      </div>

      <h1 class="auth-title">Begin your story.</h1>
      <p class="auth-subtitle">// Create your private diary</p>

      <form id="register-form" novalidate autocomplete="off">

        <div class="form-group">
          <span class="form-icon">◈</span>
          <input
            type="text"
            id="username"
            name="username"
            placeholder=" "
            autocomplete="username"
            spellcheck="false"
          />
          <label for="username" class="form-label">Username</label>
          <span class="form-error"></span>
        </div>

        <div class="form-group">
          <span class="form-icon">@</span>
          <input
            type="email"
            id="email"
            name="email"
            placeholder=" "
            autocomplete="email"
            spellcheck="false"
          />
          <label for="email" class="form-label">Email address</label>
          <span class="form-error"></span>
        </div>

        <div class="form-group">
          <span class="form-icon">⬡</span>
          <input
            type="password"
            id="password"
            name="password"
            placeholder=" "
            autocomplete="new-password"
          />
          <label for="password" class="form-label">Password</label>
          <span class="form-error"></span>
          <div class="strength-bar"><div class="strength-fill" id="strength-fill"></div></div>
          <span class="password-hint" id="strength-label">Min. 6 characters</span>
        </div>

        <button type="submit" class="btn btn-primary" id="submit-btn">
          Create Account
        </button>

      </form>

      <div class="auth-divider">
        <span>or</span>
      </div>

      <div class="auth-footer">
        Already have an account?
        <a href="login.html">Sign in →</a>
      </div>

    </div>
  </main>

  <script src="js/ui.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script>
    UI.initCursor();
    Auth.redirectIfAuth();

    // Ripple
    const submitBtn = document.getElementById('submit-btn');
    submitBtn.addEventListener('click', e => {
      const rect = submitBtn.getBoundingClientRect();
      const size = Math.max(rect.width, rect.height) * 2;
      const x = e.clientX - rect.left - size / 2;
      const y = e.clientY - rect.top  - size / 2;
      const ripple = document.createElement('span');
      ripple.className = 'btn-ripple';
      ripple.style.cssText = `width:${size}px;height:${size}px;left:${x}px;top:${y}px;`;
      submitBtn.appendChild(ripple);
      setTimeout(() => ripple.remove(), 600);
    });

    // Password strength
    const passwordInput = document.getElementById('password');
    const strengthFill  = document.getElementById('strength-fill');
    const strengthLabel = document.getElementById('strength-label');

    passwordInput.addEventListener('input', () => {
      const val = passwordInput.value;
      let score = 0;
      if (val.length >= 6)  score++;
      if (val.length >= 10) score++;
      if (/[A-Z]/.test(val))  score++;
      if (/[0-9]/.test(val))  score++;
      if (/[^A-Za-z0-9]/.test(val)) score++;

      const pct = (score / 5) * 100;
      const colors = ['#c45a5a', '#c45a5a', '#c4933f', '#5a9a6e', '#5a9a6e'];
      const labels = ['Too short', 'Weak', 'Fair', 'Strong', 'Very strong'];

      strengthFill.style.width   = pct + '%';
      strengthFill.style.background = colors[score - 1] || 'transparent';
      strengthLabel.textContent  = val.length === 0 ? 'Min. 6 characters' : (labels[score - 1] || '');
    });

    // Form submit
    const form = document.getElementById('register-form');
    form.addEventListener('submit', e => {
      e.preventDefault();
      Auth.handleRegister(form);
    });

    // Clear errors on input
    form.querySelectorAll('input').forEach(input => {
      input.addEventListener('input', () => {
        const group = input.closest('.form-group');
        if (group) group.classList.remove('has-error');
      });
    });
  </script>

</body>
</html>
