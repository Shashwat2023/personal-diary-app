<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Diary — Folio</title>
  <link rel="icon" href="favicon.ico" sizes="any">
  <link rel="icon" href="assets/favicon-32.png" type="image/png" sizes="32x32">
  <link rel="icon" href="assets/favicon-16.png" type="image/png" sizes="16x16">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="css/styles.css" />
  <link rel="stylesheet" href="css/animations.css" />
  <style>
    /* ─── Dashboard-specific styles ─── */
    .dashboard {
      display: flex;
      height: 100vh;
      overflow: hidden;
    }

    /* Sidebar overlay for mobile */
    .sidebar-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(44,44,44,0.45);
      z-index: 99;
    }

    @media (max-width: 768px) {
      .sidebar-overlay.active { display: block; }
    }

    /* ─── Main area ─── */
    .main-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      position: relative;
    }

    /* ─── Editor wrap ─── */
    #editor-wrap {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    #editor-scroll {
      flex: 1;
      overflow-y: auto;
    }

    /* ─── Welcome screen ─── */
    #welcome-screen {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
      text-align: center;
      background: var(--bg-void);
    }

    .welcome-quote {
      font-style: italic;
      font-size: 0.9rem;
      color: var(--ink-muted);
      font-family: var(--font-body);
      max-width: 320px;
      line-height: 1.9;
      letter-spacing: 0.01em;
    }

    .welcome-orb {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      border: 1.5px solid rgba(143,166,133,0.25);
      display: grid;
      place-items: center;
      font-size: 1.75rem;
      margin-bottom: 1.5rem;
      position: relative;
    }

    .welcome-orb::before {
      content: '';
      position: absolute;
      inset: -8px;
      border-radius: 50%;
      border: 1px solid rgba(143,166,133,0.10);
    }

    /* ─── Mood row ─── */
    .mood-section {
      padding: 0 4rem 1rem;
      max-width: 800px;
      width: 100%;
      margin: 0 auto;
    }

    .mood-label {
      font-family: var(--font-mono);
      font-size: 0.6rem;
      color: var(--ink-ghost);
      letter-spacing: 0.12em;
      text-transform: uppercase;
      margin-bottom: 0.5rem;
    }

    /* ─── Editor footer ─── */
    .editor-footer {
      padding: 0 4rem 1.5rem;
      max-width: 800px;
      width: 100%;
      margin: 0 auto;
      display: flex;
      align-items: center;
      gap: 0.75rem;
      border-top: 1px solid var(--border-subtle);
      padding-top: 1rem;
    }

    @media (max-width: 768px) {
      .mood-section,
      .editor-footer { padding-left: 1.5rem; padding-right: 1.5rem; }
    }

    /* ─── Entry count badge ─── */
    .entries-count {
      font-family: var(--font-mono);
      font-size: 0.58rem;
      color: var(--ink-ghost);
      letter-spacing: 0.08em;
      padding: 0 1rem 0.4rem;
      text-transform: uppercase;
    }

    /* ─── Mobile toggle ─── */
    .mobile-toggle {
      display: none;
      background: none;
      border: none;
      color: var(--ink-secondary);
      cursor: pointer;
      padding: 0.3rem 0.5rem;
      font-size: 1rem;
      line-height: 1;
      border-radius: var(--radius-sm);
      transition: color var(--transition-fast);
    }

    @media (max-width: 768px) {
      .mobile-toggle { display: flex; align-items: center; }
    }

    /* ─── Filters / streak / trash / export ─── */
    .filter-bar {
      display: flex;
      gap: 0.4rem;
      padding: 0 1rem 0.6rem;
      flex-wrap: wrap;
    }

    .filter-select {
      flex: 1;
      min-width: 0;
      font-family: var(--font-body);
      font-size: 0.75rem;
      padding: 0.35rem 0.5rem;
      border: 1px solid var(--border-muted);
      border-radius: var(--radius-sm);
      background: var(--bg-elevated);
      color: var(--ink-primary);
    }

    #favorite-btn.selected, #pin-btn.selected {
      color: var(--accent-warm);
      border-color: var(--accent-warm);
    }

    .icon-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.35rem;
    }

    .badge-icon {
      display: inline-flex;
      vertical-align: -2px;
    }

    .streak-badge {
      display: flex;
      align-items: center;
      gap: 0.3rem;
      font-family: var(--font-mono);
      font-size: 0.6rem;
      color: var(--accent-warm);
      letter-spacing: 0.06em;
      padding: 0 1rem 0.5rem;
      text-transform: uppercase;
    }

    #entry-preview {
      white-space: normal;
      overflow-wrap: break-word;
    }
    #entry-preview h1, #entry-preview h2, #entry-preview h3 {
      font-family: var(--font-display);
      margin: 0.6em 0 0.3em;
    }
    #entry-preview ul { padding-left: 1.4em; }
    #entry-preview code {
      background: var(--bg-hover);
      padding: 0.1em 0.35em;
      border-radius: 3px;
      font-family: var(--font-mono);
    }

    /* ─── Tags field (chip input with # suggestions) ─── */
    .tags-field {
      position: relative;
      flex: 1;
      min-width: 0;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.3rem;
      font-family: var(--font-body);
      padding: 0.3rem 0.5rem;
      border: 1px solid var(--border-muted);
      border-radius: var(--radius-sm);
      background: var(--bg-elevated);
      cursor: text;
    }

    .tags-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 0.3rem;
    }

    .tag-chip {
      display: inline-flex;
      align-items: center;
      gap: 0.3rem;
      font-size: 0.72rem;
      line-height: 1;
      padding: 0.3rem 0.5rem;
      border-radius: 999px;
      background: var(--bg-hover);
      color: var(--accent-warm);
      border: 1px solid var(--border-muted);
      white-space: nowrap;
    }

    .tag-chip-remove {
      background: none;
      border: none;
      padding: 0;
      margin: 0;
      color: inherit;
      opacity: 0.65;
      font-size: 0.9rem;
      line-height: 1;
      cursor: pointer;
      min-width: 16px;
      min-height: 16px;
    }
    .tag-chip-remove:hover { opacity: 1; }

    .tags-text-input {
      flex: 1;
      min-width: 80px;
      border: none;
      outline: none;
      background: transparent;
      font-family: var(--font-body);
      font-size: 0.75rem;
      color: var(--ink-primary);
      padding: 0.3rem 0.1rem;
    }

    .tags-suggest {
      display: none;
      position: absolute;
      left: 0;
      right: 0;
      top: calc(100% + 4px);
      z-index: 20;
      max-height: 220px;
      overflow-y: auto;
      background: var(--bg-elevated);
      border: 1px solid var(--border-muted);
      border-radius: var(--radius-sm);
      box-shadow: var(--shadow-md);
    }

    .tag-suggest-item {
      padding: 0.55rem 0.75rem;
      font-size: 0.8rem;
      font-family: var(--font-body);
      color: var(--ink-primary);
      cursor: pointer;
      min-height: 36px;
      display: flex;
      align-items: center;
    }
    .tag-suggest-item:hover,
    .tag-suggest-item.active {
      background: var(--bg-hover);
      color: var(--accent-warm);
    }

    @media (max-width: 480px) {
      .tags-field { min-height: 42px; }
      .tags-text-input { font-size: 0.85rem; min-width: 60px; }
      .tag-chip { font-size: 0.78rem; padding: 0.35rem 0.6rem; }
      .tag-suggest-item { padding: 0.7rem 0.85rem; font-size: 0.85rem; }
    }

    /* ─── Upgrade / Marketplace buttons (sidebar header) ─── */
    .header-actions {
      margin-left: auto;
      display: flex;
      gap: 0.4rem;
      flex-wrap: wrap;
    }
    .upgrade-btn {
      display: inline-flex;
      align-items: center;
      gap: 0.3rem;
      font-family: var(--font-body);
      font-size: 0.68rem;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      text-decoration: none;
      color: var(--accent-warm);
      background: var(--bg-hover);
      border: 1px solid var(--accent-warm);
      border-radius: 999px;
      padding: 0.3rem 0.6rem;
      white-space: nowrap;
      transition: background 0.18s ease, color 0.18s ease;
    }
    .upgrade-btn:hover {
      background: var(--accent-warm);
      color: #fff;
    }

    /* ─── Character counter (Journal plan limit) ─── */
    #char-count.near-limit { color: #C1733F; }
    #char-count.over-limit { color: #A85C5C; font-weight: 600; }

    /* ─── Date filter chip ─── */
    .date-filter-chip {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      font-size: 0.68rem;
      font-family: var(--font-mono);
      color: var(--accent-warm);
      background: var(--bg-hover);
      border: 1px solid var(--border-muted);
      border-radius: 999px;
      padding: 0.2rem 0.4rem 0.2rem 0.6rem;
      margin: 0 1rem 0.4rem;
    }
    .date-filter-chip button {
      background: none; border: none; color: inherit; cursor: pointer;
      font-size: 0.9rem; line-height: 1; padding: 0 0.2rem;
    }

    /* ─── Wide modal (calendar / stats) ─── */
    .modal-wide { max-width: 420px; }

    /* ─── Calendar modal ─── */
    .cal-nav { display: flex; align-items: center; justify-content: space-between; margin-bottom: 1rem; }
    .cal-nav button {
      background: none; border: 1px solid var(--border-muted); border-radius: var(--radius-sm);
      color: var(--ink-primary); cursor: pointer; padding: 0.3rem 0.6rem; font-size: 0.85rem;
      min-width: 34px; min-height: 34px;
    }
    .cal-nav button:hover { background: var(--bg-hover); }
    .cal-month-label { font-family: var(--font-display); font-style: italic; font-size: 1.1rem; color: var(--ink-primary); }
    .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
    .cal-weekday {
      text-align: center; font-size: 0.62rem; letter-spacing: 0.05em; text-transform: uppercase;
      color: var(--ink-secondary); padding-bottom: 0.3rem;
    }
    .cal-day {
      position: relative;
      aspect-ratio: 1;
      display: flex; align-items: center; justify-content: center;
      font-size: 0.78rem;
      color: var(--ink-primary);
      border-radius: var(--radius-sm);
      background: transparent;
      border: none;
      cursor: default;
      min-height: 34px;
    }
    .cal-day.empty { visibility: hidden; }
    .cal-day.has-entry { cursor: pointer; font-weight: 600; }
    .cal-day.has-entry:hover { background: var(--bg-hover); }
    .cal-day.has-entry::after {
      content: ''; position: absolute; bottom: 4px; left: 50%; transform: translateX(-50%);
      width: 4px; height: 4px; border-radius: 50%; background: var(--accent-warm);
    }
    .cal-day.is-today { border: 1px solid var(--accent-warm); }
    .cal-day.is-selected { background: var(--accent-warm); color: #fff; }
    .cal-day.is-selected::after { background: #fff; }

    /* ─── Stats modal ─── */
    .stats-summary { display: flex; gap: 1.5rem; margin-bottom: 1.5rem; }
    .stats-summary-item { flex: 1; text-align: center; }
    .stats-summary-num { font-family: var(--font-display); font-size: 1.8rem; color: var(--accent-warm); line-height: 1; }
    .stats-summary-label { font-size: 0.68rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--ink-secondary); margin-top: 0.3rem; }
    .stats-section-title { font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--ink-secondary); margin: 1.1rem 0 0.5rem; }
    .stats-bar-row { display: flex; align-items: center; gap: 0.5rem; margin-bottom: 0.4rem; font-size: 0.78rem; }
    .stats-bar-label { width: 78px; flex-shrink: 0; color: var(--ink-primary); text-transform: capitalize; }
    .stats-bar-track { flex: 1; height: 8px; background: var(--bg-hover); border-radius: 4px; overflow: hidden; }
    .stats-bar-fill { height: 100%; background: var(--accent-warm); border-radius: 4px; }
    .stats-bar-count { width: 24px; text-align: right; color: var(--ink-secondary); font-size: 0.72rem; }
    .stats-tags { display: flex; flex-wrap: wrap; gap: 0.4rem; }
    .stats-tag-chip {
      font-size: 0.72rem; padding: 0.25rem 0.55rem; border-radius: 999px;
      background: var(--bg-hover); border: 1px solid var(--border-muted); color: var(--accent-warm);
    }
    .stats-empty { color: var(--ink-secondary); font-size: 0.85rem; font-style: italic; }

    @media (max-width: 480px) {
      .modal-wide { max-width: 100%; }
      .cal-day { font-size: 0.85rem; }
      .stats-summary-num { font-size: 1.5rem; }
    }

    /* ─── Small-screen refinements ─── */
    @media (max-width: 480px) {
      .editor-body { padding: 1.25rem 1rem; }
      .mood-section, .editor-footer { padding-left: 1rem; padding-right: 1rem; }
      .mood-row { gap: 0.4rem; }
      .mood-btn { font-size: 0.7rem; padding: 0.4rem 0.7rem; min-height: 32px; }
      .editor-header-right { gap: 0.4rem; flex-wrap: wrap; justify-content: flex-end; }
      .word-count { display: none !important; }
      .sidebar { width: 86vw; max-width: 320px; }
      .filter-bar { flex-direction: column; }
      .filter-select, #filter-tag, .tags-field { min-height: 38px; }
      .btn-sm { min-height: 34px; }
    }
  </style>
</head>
<body>

<div class="dashboard page-enter">

  <!-- ════════════════════ SIDEBAR ════════════════════ -->
  <aside class="sidebar" id="sidebar">

    <!-- Header -->
    <div class="sidebar-header">
      <div class="sidebar-logo">
        <div class="sidebar-logo-mark">
          <img src="assets/logo-icon-light.png" class="icon-light" alt="Folio">
          <img src="assets/logo-icon-dark.png" class="icon-dark" alt="Folio">
        </div>
        <span class="sidebar-logo-name">Folio</span>
        <div class="header-actions">
          <a href="marketplace.html" class="upgrade-btn glow-btn" title="Marketplace">
            <svg viewBox="0 0 24 24" width="11" height="11" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4Z"/><path d="M3 6h18"/><path d="M16 10a4 4 0 0 1-8 0"/></svg>
            Marketplace
          </a>
          <a href="pricing.html" class="upgrade-btn glow-btn" title="View plans">
            <svg viewBox="0 0 24 24" width="11" height="11" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5"/><path d="M5 12l7-7 7 7"/></svg>
            Upgrade
          </a>
        </div>
      </div>

      <!-- Search -->
      <div class="search-bar">
        <span class="search-icon">⌕</span>
        <input
          type="text"
          id="search-input"
          placeholder="Search entries…"
          autocomplete="off"
          spellcheck="false"
        />
      </div>
    </div>

    <!-- New Entry -->
    <div class="sidebar-actions">
      <button class="new-entry-btn" id="new-entry-btn">
        <span>+</span>
        <span>New Entry</span>
      </button>
    </div>

    <!-- Filter / sort bar -->
    <div class="filter-bar">
      <select id="filter-mood" class="filter-select" title="Filter by mood">
        <option value="">All moods</option>
        <option value="happy">☀ Happy</option>
        <option value="calm">◌ Calm</option>
        <option value="reflective">◎ Reflective</option>
        <option value="anxious">◈ Anxious</option>
        <option value="sad">◇ Sad</option>
        <option value="grateful">✦ Grateful</option>
      </select>
      <input type="text" id="filter-tag" class="filter-select" placeholder="Filter tag…" />
      <select id="sort-select" class="filter-select" title="Sort entries">
        <option value="newest">Newest</option>
        <option value="oldest">Oldest</option>
        <option value="longest">Longest</option>
      </select>
    </div>

    <!-- Streak + entries count -->
    <div class="entries-count" id="entries-count"></div>
    <span class="date-filter-chip" id="date-filter-chip" style="display:none"></span>
    <div class="streak-badge" id="streak-badge" style="display:none"></div>

    <div class="sidebar-actions" style="padding-top:0;gap:0.4rem;flex-wrap:wrap;">
      <button class="btn btn-ghost btn-sm icon-btn" id="trash-toggle-btn" style="flex:1"><svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/></svg> Trash</button>
      <button class="btn btn-ghost btn-sm icon-btn" id="calendar-toggle-btn" style="flex:1"><svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4"/><path d="M8 3v4"/><path d="M3 10h18"/></svg> Calendar</button>
      <button class="btn btn-ghost btn-sm icon-btn" id="stats-btn" style="flex:1"><svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V10"/><path d="M12 20V4"/><path d="M20 20v-6"/></svg> Stats</button>
      <button class="btn btn-ghost btn-sm icon-btn" id="export-json-btn" style="flex:1" title="Export all entries as a PDF book" aria-label="Export all entries as a PDF book"><svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="M7 10l5 5 5-5"/><path d="M5 21h14"/></svg> Export</button>
    </div>

    <!-- Entry List -->
    <div class="entries-list-wrapper" id="entries-list">
      <!-- Rendered by JS -->
    </div>

    <!-- Footer / User -->
    <div class="sidebar-footer">
      <div class="user-info">
        <div class="user-avatar" id="user-avatar">?</div>
        <span class="user-name" id="user-name">Loading…</span>
      </div>

      <!-- Dark mode toggle -->
      <button class="theme-toggle" id="theme-toggle" title="Switch to dark mode" aria-label="Switch theme">◑</button>

      <!-- Logout -->
      <button class="logout-btn" id="logout-btn" title="Sign out" aria-label="Sign out">
        <span>⇥</span>
        <span>Out</span>
      </button>
    </div>

  </aside>

  <!-- Mobile overlay -->
  <div class="sidebar-overlay" id="sidebar-overlay"></div>

  <!-- ════════════════════ MAIN AREA ════════════════════ -->
  <main class="main-area">

    <!-- Editor Header / Toolbar -->
    <header class="editor-header" id="editor-header">
      <div class="editor-header-left">
        <!-- Mobile toggle -->
        <button class="mobile-toggle" id="mobile-toggle">☰</button>

        <div class="entry-timestamp-display">
          <span id="editor-date-header"></span>
          <span style="color:var(--border-visible);margin:0 0.4rem;">·</span>
          <span class="live-time" id="live-time"></span>
        </div>
      </div>

      <div class="editor-header-right">
        <!-- Autosave indicator -->
        <div class="autosave-indicator" id="autosave-indicator">
          <div class="autosave-dot" id="autosave-dot"></div>
          <span id="autosave-text">Saved</span>
        </div>

        <!-- Word count -->
        <span class="word-count" id="word-count" style="display:none"></span>
        <span class="word-count" id="reading-time" style="display:none"></span>
        <span class="word-count" id="char-count" style="display:none"></span>

        <!-- Favorite / Pin / Preview -->
        <button class="btn btn-ghost btn-sm" id="favorite-btn" style="display:none" title="Favorite" aria-label="Favorite this entry">☆</button>
        <button class="btn btn-ghost btn-sm" id="pin-btn" style="display:none" title="Pin" aria-label="Pin this entry"><svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 17v5"/><path d="M9 10.76a2 2 0 0 1-1.11 1.79l-1.78.9A2 2 0 0 0 5 15.24V16a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-.76a2 2 0 0 0-1.11-1.79l-1.78-.9A2 2 0 0 1 15 10.76V7a1 1 0 0 1 1-1 2 2 0 0 0 0-4H8a2 2 0 0 0 0 4 1 1 0 0 1 1 1z"/></svg></button>
        <button class="btn btn-ghost btn-sm" id="preview-btn" style="display:none" title="Toggle markdown preview">Preview</button>

        <!-- Action buttons -->
        <button class="btn btn-danger btn-sm" id="delete-btn" style="display:none">
          Delete
        </button>
        <button class="btn btn-ghost btn-sm" id="save-btn" style="display:none">
          Save
        </button>
      </div>
    </header>

    <!-- Welcome Screen -->
    <div id="welcome-screen">
      <div class="welcome-orb"><svg viewBox="0 0 24 24" width="30" height="30" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 5.5A2.5 2.5 0 0 1 5.5 3H12v18H5.5A2.5 2.5 0 0 1 3 18.5z"/><path d="M21 5.5A2.5 2.5 0 0 0 18.5 3H12v18h6.5a2.5 2.5 0 0 0 2.5-2.5z"/></svg></div>
      <h1 class="welcome-title">Your diary awaits.</h1>
      <div class="welcome-divider"></div>
      <p class="welcome-quote">
        "Fill your paper with the breathings of your heart."<br>
        — William Wordsworth
      </p>
      <br />
      <button class="btn btn-ghost btn-sm" onclick="document.getElementById('new-entry-btn').click()" style="margin-top:1rem">
        Start writing →
      </button>
    </div>

    <!-- Editor Wrap (hidden until entry selected/created) -->
    <div id="editor-wrap" style="display:none; flex-direction:column; flex:1; overflow:hidden;">

      <div id="editor-scroll" style="flex:1; overflow-y:auto;">

        <!-- Editor body -->
        <div class="editor-body">

          <!-- Date heading -->
          <div class="editor-date-display" id="editor-date"></div>

          <!-- Textarea -->
          <textarea
            id="entry-editor"
            class="editor-textarea"
            placeholder="Begin writing… let the words come. (Markdown supported: **bold**, *italic*, # heading, - list)"
            spellcheck="true"
            autocorrect="on"
          ></textarea>

          <!-- Markdown preview (hidden by default) -->
          <div id="entry-preview" class="editor-textarea" style="display:none;"></div>

        </div>

      </div>

      <!-- Mood row -->
      <div class="mood-section">
        <div class="mood-label">Mood</div>
        <div class="mood-row">
          <button class="mood-btn" data-mood="happy">☀ Happy</button>
          <button class="mood-btn" data-mood="calm">◌ Calm</button>
          <button class="mood-btn" data-mood="reflective">◎ Reflective</button>
          <button class="mood-btn" data-mood="anxious">◈ Anxious</button>
          <button class="mood-btn" data-mood="sad">◇ Sad</button>
          <button class="mood-btn" data-mood="grateful">✦ Grateful</button>
        </div>
        <div class="mood-label" style="margin-top:0.75rem;">Category &amp; Tags</div>
        <div class="mood-row">
          <select id="category-select" class="filter-select">
            <option value="">No category</option>
            <option value="personal">Personal</option>
            <option value="work">Work</option>
            <option value="travel">Travel</option>
            <option value="health">Health</option>
            <option value="gratitude">Gratitude</option>
          </select>
          <div class="tags-field" id="tags-field">
            <div class="tags-chips" id="tags-chips"></div>
            <input type="text" id="tags-input" class="tags-text-input" placeholder="Add a tag…" autocomplete="off" inputmode="text" aria-label="Add a tag" />
            <div class="tags-suggest" id="tags-suggest" role="listbox" aria-label="Tag suggestions"></div>
          </div>
        </div>
        <div class="mood-row" style="margin-top:0.5rem;">
          <button class="btn btn-ghost btn-sm template-btn" data-template="morning">Morning pages</button>
          <button class="btn btn-ghost btn-sm template-btn" data-template="evening">Evening reflection</button>
          <button class="btn btn-ghost btn-sm template-btn" data-template="gratitude">Gratitude</button>
        </div>
        <div class="goal-progress" id="goal-progress" style="display:none;">
          <div class="goal-progress-bar"><div class="goal-progress-fill" id="goal-progress-fill"></div></div>
          <span class="goal-progress-text" id="goal-progress-text"></span>
        </div>
      </div>

      <!-- Editor footer -->
      <div class="editor-footer">
        <button class="btn btn-primary btn-sm" id="save-btn-footer">Save Entry</button>
        <button class="btn btn-danger btn-sm" id="delete-btn-footer" style="display:none">Delete</button>
      </div>

    </div>

  </main>

</div>

<!-- Scripts (order matters) -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabaseClient.js"></script>
<script src="js/ui.js"></script>
<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script src="js/subscription.js"></script>
<script src="js/diary.js"></script>
<script>
  // Apply saved theme immediately (before any render)
  UI.initTheme();

  // Auth guard (async — Supabase session check)
  (async () => {
  if (!(await Auth.requireAuth())) {
    // redirected to login.html
  } else {
    // Init diary
    Diary.init();

    // ── Dark mode toggle ──────────────────────
    document.getElementById('theme-toggle')?.addEventListener('click', () => {
      UI.toggleTheme();
    });

    // ── Logout ────────────────────────────────
    // Handled by Auth.logout() wired in diary.js,
    // but also wire the button directly as a safety net.
    document.getElementById('logout-btn')?.addEventListener('click', () => {
      Auth.logout();
    });

    // ── Footer save/delete proxies ────────────
    document.getElementById('save-btn-footer')?.addEventListener('click', () => {
      document.getElementById('save-btn').click();
    });

    document.getElementById('delete-btn-footer')?.addEventListener('click', () => {
      document.getElementById('delete-btn').click();
    });

    // ── Sync button/wordcount visibility with editor wrap ──
    const editorObserver = new MutationObserver(() => {
      const wrap    = document.getElementById('editor-wrap');
      const visible = wrap.style.display !== 'none';
      const wc      = document.getElementById('word-count');
      const saveBtn = document.getElementById('save-btn');
      if (wc)      wc.style.display      = visible ? 'block' : 'none';
      if (saveBtn) saveBtn.style.display  = visible ? 'flex'  : 'none';
    });

    const editorWrap = document.getElementById('editor-wrap');
    if (editorWrap) {
      editorObserver.observe(editorWrap, { attributes: true, attributeFilter: ['style'] });
    }

    // ── Mobile sidebar toggle ─────────────────
    const sidebar        = document.getElementById('sidebar');
    const sidebarOverlay = document.getElementById('sidebar-overlay');
    const mobileToggle   = document.getElementById('mobile-toggle');

    mobileToggle?.addEventListener('click', () => {
      sidebar.classList.toggle('open');
      sidebarOverlay.classList.toggle('active');
    });

    sidebarOverlay?.addEventListener('click', () => {
      sidebar.classList.remove('open');
      sidebarOverlay.classList.remove('active');
    });

    document.getElementById('entries-list')?.addEventListener('click', () => {
      if (window.innerWidth < 769) {
        sidebar.classList.remove('open');
        sidebarOverlay.classList.remove('active');
      }
    });

    // ── Sync editor-date-header with editor-date ──
    const editorDate       = document.getElementById('editor-date');
    const editorDateHeader = document.getElementById('editor-date-header');

    const syncHeaderDate = new MutationObserver(() => {
      if (editorDateHeader && editorDate) {
        editorDateHeader.textContent = editorDate.textContent;
      }
    });

    if (editorDate) {
      syncHeaderDate.observe(editorDate, { childList: true, characterData: true, subtree: true });
    }
  }
  })();
</script>

</body>
</html>
