<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Checkout — Folio</title>
  <link rel="icon" href="favicon.ico" sizes="any">
  <link rel="icon" href="assets/favicon-32.png" type="image/png" sizes="32x32">
  <link rel="icon" href="assets/favicon-16.png" type="image/png" sizes="16x16">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="css/styles.css" />
  <link rel="stylesheet" href="css/animations.css" />
  <style>
    .pay-wrapper { max-width: 460px; margin: 0 auto; padding: 3rem 1.5rem 5rem; position: relative; z-index: 1; }
    .pay-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 2rem; }
    .pay-back { color: var(--ink-secondary); text-decoration: none; font-family: var(--font-body); font-size: 0.88rem; }
    .pay-back:hover { color: var(--ink-primary); }

    .pay-card {
      background: var(--bg-elevated);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-lg);
      padding: 2rem clamp(1.5rem, 5vw, 2.5rem);
      box-shadow: var(--shadow-md);
    }

    #pay-title { font-family: var(--font-display); font-style: italic; font-size: 1.6rem; color: var(--ink-primary); margin: 0 0 0.2rem; }
    #pay-subtitle { font-family: var(--font-body); font-size: 0.85rem; color: var(--ink-secondary); margin: 0 0 1.75rem; }

    .pay-error {
      display: none;
      background: rgba(168,92,92,0.12);
      border: 1px solid rgba(168,92,92,0.35);
      color: #A85C5C;
      border-radius: var(--radius-sm);
      padding: 0.7rem 0.9rem;
      font-family: var(--font-body);
      font-size: 0.85rem;
      margin-bottom: 1.25rem;
    }

    /* ── Coupon ── */
    .coupon-block { margin-bottom: 1.75rem; }
    .coupon-label { font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--ink-secondary); margin-bottom: 0.5rem; font-family: var(--font-body); }
    .coupon-row { display: flex; gap: 0.5rem; }
    #coupon-input {
      flex: 1; font-family: var(--font-body); font-size: 0.85rem;
      padding: 0.6rem 0.8rem; border: 1px solid var(--border-muted);
      border-radius: var(--radius-sm); background: var(--bg-primary); color: var(--ink-primary);
      text-transform: uppercase;
    }
    #coupon-input:focus { outline: none; border-color: var(--accent-warm); }
    #coupon-apply {
      font-family: var(--font-body); font-size: 0.8rem; padding: 0.6rem 1.1rem;
      border: 1.5px solid var(--accent-warm); background: transparent; color: var(--accent-warm);
      border-radius: var(--radius-sm); cursor: pointer; white-space: nowrap;
    }
    #coupon-apply:hover:not(:disabled) { background: var(--accent-warm); color: #fff; }
    #coupon-apply:disabled { opacity: 0.6; cursor: default; }
    #coupon-message { display: none; color: #A85C5C; font-size: 0.78rem; margin-top: 0.5rem; font-family: var(--font-body); }

    #coupon-applied {
      display: none;
      align-items: center;
      justify-content: space-between;
      background: var(--bg-hover);
      border: 1px solid var(--accent-warm);
      border-radius: var(--radius-sm);
      padding: 0.6rem 0.9rem;
      font-family: var(--font-body);
      font-size: 0.82rem;
      color: var(--accent-warm);
    }
    #coupon-remove { background: none; border: none; color: inherit; cursor: pointer; font-size: 0.95rem; opacity: 0.75; }
    #coupon-remove:hover { opacity: 1; }

    /* ── Amount summary ── */
    .pay-summary { border-top: 1px solid var(--border-subtle); padding-top: 1.25rem; margin-bottom: 1.75rem; }
    .pay-row { display: flex; justify-content: space-between; font-family: var(--font-body); font-size: 0.88rem; color: var(--ink-primary); margin-bottom: 0.5rem; }
    #pay-discount-row { display: none; color: var(--accent-warm); }
    .pay-total-row { display: flex; justify-content: space-between; align-items: baseline; padding-top: 0.75rem; border-top: 1px solid var(--border-subtle); }
    .pay-total-label { font-family: var(--font-body); font-size: 0.85rem; color: var(--ink-secondary); }
    #pay-total-amount { font-family: var(--font-display); font-size: 1.8rem; color: var(--ink-primary); }

    #pay-btn {
      width: 100%; padding: 0.85rem; border-radius: var(--radius-md);
      font-family: var(--font-body); font-size: 0.9rem; cursor: pointer;
      border: none; background: #64745D; color: #fff;
    }
    #pay-btn:hover:not(:disabled) { background: #576352; }
    #pay-btn:disabled { opacity: 0.6; cursor: default; }

    .pay-note { margin-top: 1.25rem; text-align: center; font-family: var(--font-body); font-size: 0.72rem; color: var(--ink-secondary); }

    @media (max-width: 420px) {
      .pay-card { padding: 1.5rem; }
      .coupon-row { flex-direction: column; }
    }
  </style>
</head>
<body class="page-enter">

  <div class="auth-noise"></div>

  <div class="pay-wrapper">
    <div class="pay-top">
      <a href="javascript:history.back()" class="pay-back">← Back</a>
      <button class="theme-toggle" id="theme-toggle" title="Switch theme" aria-label="Switch theme">◑</button>
    </div>

    <div class="pay-card">
      <div id="pay-error" class="pay-error"></div>

      <h1 id="pay-title">Loading…</h1>
      <p id="pay-subtitle"></p>

      <div class="coupon-block">
        <div class="coupon-label">Coupon code</div>
        <div class="coupon-row">
          <input type="text" id="coupon-input" placeholder="Enter code" autocomplete="off" />
          <button type="button" id="coupon-apply">Apply</button>
        </div>
        <div id="coupon-message"></div>
        <div id="coupon-applied">
          <span>✦ <span class="coupon-code-label"></span> applied</span>
          <button type="button" id="coupon-remove" aria-label="Remove coupon">×</button>
        </div>
      </div>

      <div class="pay-summary">
        <div class="pay-row" id="pay-base-row">
          <span>Price</span>
          <span id="pay-base-amount">—</span>
        </div>
        <div class="pay-row" id="pay-discount-row">
          <span>Discount</span>
          <span id="pay-discount-amount">—</span>
        </div>
        <div class="pay-total-row">
          <span class="pay-total-label">Total</span>
          <span id="pay-total-amount">—</span>
        </div>
      </div>

      <button id="pay-btn" disabled>Pay</button>

      <p class="pay-note">Payments are processed securely by Razorpay. Folio never sees your card details.</p>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabaseClient.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/subscription.js"></script>
  <script src="js/payment.js"></script>
  <script>
    UI.initTheme();
    document.getElementById('theme-toggle')?.addEventListener('click', () => UI.toggleTheme());
    document.getElementById('pay-btn').disabled = false;
    Payment.init();
  </script>

</body>
</html>
