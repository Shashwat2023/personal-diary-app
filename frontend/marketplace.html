<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Marketplace — Folio</title>
  <link rel="icon" href="favicon.ico" sizes="any">
  <link rel="icon" href="assets/favicon-32.png" type="image/png" sizes="32x32">
  <link rel="icon" href="assets/favicon-16.png" type="image/png" sizes="16x16">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="css/styles.css" />
  <link rel="stylesheet" href="css/animations.css" />
  <style>
    .mk-wrapper { max-width: 1100px; margin: 0 auto; padding: 2.5rem 1.5rem 5rem; position: relative; z-index: 1; }

    .mk-top { display: flex; align-items: center; justify-content: space-between; gap: 1rem; margin-bottom: 2rem; }
    .mk-back { color: var(--ink-secondary); text-decoration: none; font-family: var(--font-body); font-size: 0.88rem; }
    .mk-back:hover { color: var(--ink-primary); }
    .mk-top-right { display: flex; align-items: center; gap: 0.6rem; }
    .mk-plan-tag {
      font-size: 0.65rem; text-transform: uppercase; letter-spacing: 0.08em;
      color: var(--accent-warm); border: 1px solid var(--accent-warm);
      border-radius: 999px; padding: 0.25rem 0.6rem; font-family: var(--font-body);
    }

    .mk-head { margin-bottom: 2rem; }
    .mk-head h1 { font-family: var(--font-display); font-style: italic; font-size: 2.2rem; color: var(--ink-primary); margin: 0 0 0.4rem; }
    .mk-head p { color: var(--ink-secondary); font-family: var(--font-body); font-size: 0.92rem; margin: 0; }

    .mk-tabs { display: flex; flex-wrap: wrap; gap: 0.4rem; margin-bottom: 1.75rem; }
    .mk-tab {
      font-family: var(--font-body); font-size: 0.78rem; padding: 0.45rem 0.9rem;
      border-radius: 999px; border: 1px solid var(--border-muted);
      background: var(--bg-elevated); color: var(--ink-secondary); cursor: pointer;
      transition: all 0.18s ease;
    }
    .mk-tab:hover { color: var(--ink-primary); border-color: var(--accent-warm); }
    .mk-tab.active { background: var(--accent-warm); color: #fff; border-color: var(--accent-warm); }

    .mk-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 1.25rem;
    }

    .mk-card {
      position: relative;
      background: var(--bg-elevated);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-lg);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: transform 0.22s ease, box-shadow 0.22s ease, border-color 0.22s ease;
    }
    .mk-card:hover { transform: translateY(-3px); box-shadow: var(--shadow-md); }
    .mk-card.is-active { border-color: var(--accent-warm); box-shadow: 0 0 0 1px var(--accent-warm); }

    .mk-plan-badge {
      position: absolute; top: 0.6rem; right: 0.6rem; z-index: 2;
      font-size: 0.58rem; text-transform: uppercase; letter-spacing: 0.07em;
      background: var(--bg-primary); color: var(--accent-warm);
      border: 1px solid var(--accent-warm); border-radius: 999px;
      padding: 0.2rem 0.5rem; font-family: var(--font-body);
    }

    .mk-preview { height: 108px; display: flex; align-items: center; justify-content: center; }
    .mk-preview-theme { gap: 0; }
    .mk-swatch { flex: 1; height: 100%; display: block; }
    .mk-preview-font {
      font-size: 1.05rem; padding: 0 1rem; text-align: center;
      color: var(--ink-primary); background: var(--bg-hover); line-height: 1.4;
    }
    .mk-preview-theme.is-animated::after {
      content: '✦'; position: absolute; top: 46px; left: 50%;
      transform: translateX(-50%); color: rgba(255,255,255,0.75); font-size: 0.9rem;
      animation: softGlow 2.6s ease-in-out infinite;
    }

    .mk-card-body { padding: 0.9rem 1rem 1rem; display: flex; flex-direction: column; flex: 1; }
    .mk-card-name { font-family: var(--font-display); font-size: 1.05rem; color: var(--ink-primary); margin: 0 0 0.25rem; }
    .mk-card-desc { font-family: var(--font-body); font-size: 0.78rem; color: var(--ink-secondary); line-height: 1.5; margin: 0 0 0.9rem; flex: 1; }
    .mk-card-foot { display: flex; align-items: center; justify-content: space-between; gap: 0.5rem; }
    .mk-price { font-family: var(--font-body); font-size: 0.85rem; color: var(--ink-primary); }

    .mk-btn {
      font-family: var(--font-body); font-size: 0.74rem; padding: 0.45rem 0.8rem;
      border-radius: var(--radius-sm); cursor: pointer; white-space: nowrap;
      border: 1px solid var(--accent-warm); background: transparent; color: var(--accent-warm);
      text-decoration: none; display: inline-block; transition: all 0.18s ease;
    }
    .mk-btn:hover:not(:disabled) { background: var(--accent-warm); color: #fff; }
    .mk-btn:disabled { opacity: 0.6; cursor: default; }
    .mk-btn.is-active-btn { background: var(--accent-warm); color: #fff; }
    .mk-btn.mk-locked { border-color: var(--border-muted); color: var(--ink-secondary); }

    .mk-empty { color: var(--ink-secondary); font-family: var(--font-body); font-style: italic; padding: 3rem 0; text-align: center; }

    @media (max-width: 520px) {
      .mk-grid { grid-template-columns: 1fr 1fr; gap: 0.8rem; }
      .mk-card-name { font-size: 0.92rem; }
      .mk-card-desc { display: none; }
      .mk-preview { height: 84px; }
      .mk-head h1 { font-size: 1.7rem; }
    }
    @media (max-width: 360px) {
      .mk-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body class="page-enter">

  <div class="auth-noise"></div>

  <div class="mk-wrapper">
    <div class="mk-top">
      <a href="dashboard.html" class="mk-back">← Back to your diary</a>
      <div class="mk-top-right">
        <span class="mk-plan-tag" id="mk-plan-tag">Journal</span>
        <a href="pricing.html" class="mk-btn">Plans</a>
        <button class="theme-toggle" id="theme-toggle" title="Switch theme" aria-label="Switch theme">◑</button>
      </div>
    </div>

    <div class="mk-head">
      <h1>Marketplace</h1>
      <p>Themes, fonts and finishes for your diary. Anything you buy stays yours.</p>
    </div>

    <div class="mk-tabs" id="mk-tabs" role="tablist"></div>
    <div class="mk-grid" id="mk-grid"></div>
    <div class="mk-empty" id="mk-empty" style="display:none"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabaseClient.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/subscription.js"></script>
  <script src="js/marketplace.js"></script>
  <script>
    UI.initTheme();
    document.getElementById('theme-toggle')?.addEventListener('click', () => UI.toggleTheme());

    (async () => {
      if (!(await Auth.requireAuth())) return;
      await Subscription.loadAppearance();
      await Marketplace.init();
    })();
  </script>

</body>
</html>
